<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight Simulator</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    canvas{display:block;width:100%;height:100%;background:#87CEEB}
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="fps" style="position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; pointer-events: none;">FPS: 0</div>
  <script type="module" src="engine.js"></script>
</body>
</html>
