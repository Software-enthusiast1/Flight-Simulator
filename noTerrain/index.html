<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Google</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    canvas{display:block;width:100%;height:100%;}
    #editorPanel{
      position:absolute;top:10px;left:10px;
      background:rgba(0,0,0,0.8);color:#fff;
      padding:15px;border-radius:5px;
      font-family:monospace;font-size:12px;
      max-height:80vh;overflow-y:auto;
      z-index:100;
      min-width:300px;
    }
    #editorPanel h3{margin-bottom:10px;color:#0f0;}
    .vertex-row{margin-bottom:10px;padding:5px;background:rgba(255,255,255,0.05);border-radius:3px;}
    .vertex-row label{display:block;color:#0f0;margin-bottom:3px;}
    .vertex-row input{width:100%;padding:3px;background:#222;border:1px solid #0f0;color:#0f0;margin-bottom:3px;}
    .vertex-row input:focus{outline:none;background:#333;}
    #copyBtn{
      width:100%;padding:8px;background:#0f0;color:#000;border:none;border-radius:3px;
      cursor:pointer;font-weight:bold;margin-top:10px;
    }
    #copyBtn:hover{background:#0f0;opacity:0.9;}
    #editToggle{
      position:absolute;top:10px;right:10px;
      background:#0f0;color:#000;border:none;
      padding:8px 12px;border-radius:3px;cursor:pointer;
      font-weight:bold;z-index:100;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <button id="editToggle">Show Editor</button>
  <div id="editorPanel" style="display:none;"></div>
  <script src="noTerrainEngine.js"></script>
</body>
</html>
